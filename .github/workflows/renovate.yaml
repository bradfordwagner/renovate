name: renovate

run-name: renovate ${{ inputs.repository || 'all' }}

on:
  schedule:
    # 6am EST; GitHub cron is UTC-only, so this is 7am during EDT.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "Only process this repo (owner/name); empty processes every repo in config.js"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  repos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: list repositories
        id: list
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          node -e '
            const all = require("./config.js").repositories;
            const one = process.env.REPOSITORY;
            if (one && !all.includes(one)) { console.error(one + " is not in config.js"); process.exit(1); }
            console.log("list=" + JSON.stringify(one ? [one] : all));
          ' >> "$GITHUB_OUTPUT"

  renovate:
    needs: repos
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.repos.outputs.list) }}
    concurrency:
      group: renovate-${{ matrix.repo }}
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          configurationFile: config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: '["${{ matrix.repo }}"]'

  delete-branch-on-merge:
    if: inputs.repository == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mint admin token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: write
          permission-metadata: read
      - name: enable delete_branch_on_merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          status=0
          while read -r repo; do
            if ! current=$(gh api "repos/$repo" -q .delete_branch_on_merge); then
              echo "$repo: lookup failed"; status=1; continue
            fi
            if [ "$current" = "true" ]; then
              echo "$repo: already enabled"
            elif gh api -X PATCH "repos/$repo" -F delete_branch_on_merge=true --silent; then
              echo "$repo: enabled"
            else
              echo "$repo: update failed"; status=1
            fi
          done < <(node -p "require('./config.js').repositories.join('\n')")
          exit "$status"
